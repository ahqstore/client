name: "Build & Release App, Service, Scripts"
on:
  push:
    branches:
      - main
      - release

permissions: write-all

jobs:
  create-release:
    name: Create a new github release

    permissions:
      contents: write

    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.get-u-url.outputs.result }}
      release_id: ${{ steps.get-id.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.result }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("fs");
            const version = require('./package.json').version;

            const alpha = process.env.BRANCH != "release";
            const alphaId = Date.now();

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: !alpha ? version : `alpha-${alphaId}`,
              name: alpha ? `AHQ Store Alpha v${version}-next-${alphaId}` : `AHQ Store v${version}`,
              body: String(fs.readFileSync("./latest.md")),
              draft: true,
              prerelease: alpha
            });
            return data

      - name: Get Release Id
        id: get-id
        uses: actions/github-script@v7
        env:
          data: ${{ steps.create-release.outputs.result }}
        with:
          result-encoding: string
          script: |
            let data = process.env.data;

            try {
              data = JSON.parse(data);

              console.log(data.id);

              return data.id;
            } catch (_) {
              console.log(data.id);
              return data.id;
            }

      - name: Get Upload Url
        id: get-u-url
        uses: actions/github-script@v7
        env:
          data: ${{ steps.create-release.outputs.result }}
        with:
          result-encoding: string
          script: |
            let data = process.env.data;

            try {
              data = JSON.parse(data);

              return data.upload_url;
            } catch (_) {
              return data.upload_url;
            }

      - name: Get Tag Name
        id: get-tag
        uses: actions/github-script@v7
        env:
          data: ${{ steps.create-release.outputs.result }}
        with:
          result-encoding: string
          script: |
            let data = process.env.data;

            try {
              data = JSON.parse(data);

              return data.tag_name;
            } catch (_) {
              return data.tag_name;
            }

  publish-cargo:
    name: Publish ahqstore-types to cargo

    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Publish types to cargo
        run: cargo publish
        working-directory: src-ahqstore-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        continue-on-error: true

  publish-types-npm:
    name: Publish ahqstore-types to npmjs

    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install wasm-pack
        run: npm i -g wasm-pack
        working-directory: src-ahqstore-types

      - name: Build NPM Binaries
        run: wasm-pack build --release -- --features js
        working-directory: src-ahqstore-types

      - name: Publish NPM Binaries
        run: npm publish
        working-directory: src-ahqstore-types/pkg
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AHQSTORE_TYPES }}

  make-setup:
    needs: create-release
    name: Make Setup Executable (${{ matrix.os }}-${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4

      - name: Install packages
        run: |
          npm i -g pnpm
          pnpm install

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - name: Install Dependencies (arm v8 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install gcc-aarch64-linux-gnu

      - name: Build Windows GUI Setup
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: src-setup

      - name: Build Linux CLI Setup
        if: matrix.os != 'windows-latest'
        run: node linux_setup.cjs
        env:
          TAG: ${{ needs.create-release.outputs.tag_name }}

      - name: Upload Windows Setup
        if: matrix.os == 'windows-latest'
        uses: ahqstore/upload-release-assets@v60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./src-setup/target/${{ matrix.target }}/release/ahqstore_setup_amd64.exe
          asset_name: ahqstore_setup_win32_${{ matrix.arch }}.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Upload Linux Setup
        if: matrix.os != 'windows-latest'
        uses: ahqstore/upload-release-assets@v60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./install.sh
          asset_name: install.sh
          asset_content_type: application/octet-stream

  publish-android:
    needs: create-release
    runs-on: ubuntu-latest
    name: Build Tauri App (universal-linux-android)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm i -g pnpm

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Android Signing
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=upload" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build ahqstore-types locally
        run: |
          npm i -g wasm-pack
          wasm-pack build --release -- --features js
        working-directory: src-ahqstore-types

      - name: Build Tauri App
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export NDK_HOME="$ANDROID_NDK_HOME"

          pnpm install
          pnpm tauri android build
        env:
          CI: "false"

  publish-tauri:
    needs: create-release
    name: Build Tauri App (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm i -g pnpm

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: nightly

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Dependencies (arm v8 only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo chmod -R 777 /

      - name: Build ahqstore-types locally
        run: |
          npm i -g wasm-pack
          wasm-pack build --release -- --features js
        working-directory: src-ahqstore-types

      - name: install Vite dependencies and Build React App
        run: pnpm install; pnpm build
        env:
          CI: "false"

      - name: Build Tauri App
        id: tauri-app
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KEYPASS }}
        with:
          args: --verbose --target ${{ matrix.target }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeRelease: true
          includeUpdaterJson: false

  undraft-release:
    needs: [create-release, publish-tauri, make-setup, publish-android]
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Undraft Release
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ github.ref_name }}
          R_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: "ahqstore",
              repo: "client",
              release_id: process.env.R_ID,
              draft: false
            });
