[package]
name = "ahqstore_setup_amd64"
version = "2.1.0"
edition = "2021"
repository = "https://github.com/ahqstore/client"
homepage = "https://ahqstore.github.io/"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "6"
i-slint-backend-winit = "1.9"
lazy_static = "1"
open = "5"
reqwest = { version = "0.12.5", features = ["json", "rustls-tls"] }
serde = { version = "1.0.206", features = ["derive"] }
slint = "1"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
check_elevation = "0.2.4"
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[build-dependencies]
slint-build = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.tauri-winres]
LegalCopyright = "© AHQ Softwares | Non Profit Organization"
OriginalFilename = "ahqstore_setup_amd64.exe"
