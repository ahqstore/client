[package]
name = "ahqstore-types"
description = "Standard types used by AHQ Store"
version = "4.2.0"
edition = "2021"
license-file = "../LICENSE.md"
repository = "https://github.com/ahqstore/client"
homepage = "https://ahqstore.github.io/"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.13", features = [
  "json",
  "rustls-no-provider",
  "http2",
], default-features = false, optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "sync"] }

specta = { version = "1", features = ["export"], optional = true }

[features]
default = ["internet", "apps_repo"]
internet = ["dep:reqwest"]
apps_repo = []

export = ["dep:specta"]
