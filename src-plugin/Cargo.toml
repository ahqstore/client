[package]
name = "tauri-plugin-ahqstore"
version = "1.0.0"
authors = ["AHQ"]
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ahqstore"

[dependencies]
tauri = { version = "2" }
serde = "1"
thiserror = "2"
ahqstore-types = { path = "../src-ahqstore-types" }
anyhow = "1"
ahqstore_gh_hash = "1"
open = "5"

[target.'cfg(windows)'.dependencies]
msi = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
lixploy = { git = "https://github.com/ahqstore/lixploy" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
