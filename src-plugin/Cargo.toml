[package]
name = "tauri-plugin-ahqstore"
version = "1.0.0"
authors = ["AHQ"]
edition = "2021"
rust-version = "1.82"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ahqstore"

[dependencies]
tauri = { version = "2" }
serde = "1"
thiserror = "2"
ahqstore-types = { path = "../src-ahqstore-types" }
anyhow = "1"
ahqstore_gh_hash = "1"
open = "5"
serde_json = "1"
chacha20poly1305 = { version = "0.10", features = ["heapless"] }
lazy_static = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["time", "macros", "sync", "fs"] }
futures = "0.3"
tantivy = "0.25"

ts-rs = "11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Networking_Connectivity",
  "Win32_Security",
] }
msi = "0.9"
win32_notif = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
lixploy = { git = "https://github.com/ahqstore/lixploy" }
whatadistro = "0.1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
