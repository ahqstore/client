[package]
name = "tauri-plugin-ahqstore"
version = "1.0.0"
authors = ["AHQ"]
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ahqstore"

[dependencies]
tauri = { version = "2" }
serde = "1"
thiserror = "2"
ahqstore-types = { path = "../src-ahqstore-types" }
anyhow = "1"
ahqstore_gh_hash = "1"
open = "5"
serde_json = "1.0.138"
chacha20poly1305 = { version = "0.10.1", features = ["heapless"] }
bcrypt = "0.17.0"
lazy_static = "1.5.0"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.43.0", features = ["time", "sync"] }

[target.'cfg(windows)'.dependencies]
msi = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
lixploy = { git = "https://github.com/ahqstore/lixploy" }
whatadistro = "0.1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
